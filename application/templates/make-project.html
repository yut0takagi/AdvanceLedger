<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>たびわり - グループ作成</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 text-gray-800">
  <header class="bg-blue-600 text-white p-4 shadow-md">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">たびわり</h1>
      <nav class="space-x-4 text-sm">
        <a href="/" class="hover:underline">ホーム</a>
        <a href="#" class="hover:underline">グループ</a>
        <a href="#" class="hover:underline">履歴</a>
      </nav>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-12">
    <h2 class="text-2xl font-bold mb-6 text-center">グループ作成</h2>
    <p class="text-center text-gray-600 mb-6">参加者の名前を入力してください。Enterで次の入力欄が追加されます。</p>

    <form id="group-form" method="POST" action="{{ url_for('create_group') }}" class="space-y-4">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">旅行タイトル</label>
        <input type="text" name="trip_title" placeholder="例：北海道旅行" class="w-full p-2 border rounded" required>
      </div>
      <div id="member-fields" class="space-y-3">
        <input type="text" name="members" placeholder="参加者名" class="w-full p-2 border rounded" onkeydown="handleKey(event)" required>
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-500">グループを作成</button>
    </form>
  </main>

  <footer class="text-center text-gray-500 text-sm py-6">
    &copy; 2025 たびわり - 旅行精算アプリ
  </footer>

  <script>
    function handleKey(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        const input = event.target;
        if (input.value.trim() !== "") {
          const newInput = document.createElement("input");
          newInput.type = "text";
          newInput.name = "members";
          newInput.placeholder = "参加者名";
          newInput.className = "w-full p-2 border rounded";
          newInput.onkeydown = handleKey;
          document.getElementById("member-fields").appendChild(newInput);
          newInput.focus();
        }
      }
    }
  </script>
</body>
</html>
