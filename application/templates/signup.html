{% extends 'layout/layout1.html' %}
{% block content %}
<div class="flex items-center justify-center min-h-screen bg-blue-50 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-lg">
    <div>
      <h2 class="text-center text-3xl font-extrabold text-gray-800">新規登録</h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        ペイとも でお金のやりとりをもっとスマートに。
      </p>
    </div>
    <form class="mt-8 space-y-6" method="POST" action="{{ url_for('auth.signup') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="rounded-md shadow-sm -space-y-px">
        <div class="mb-4">
          <label for="name" class="block text-sm font-medium text-gray-700">名前</label>
          <input id="name" name="name" type="text" required
            class="appearance-none w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500">
        </div>
        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-gray-700">メールアドレス</label>
          <input id="email" name="email" type="email" required autocomplete="email"
            class="appearance-none w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500">
        </div>
        <div class="mb-4">
          <label for="password" class="block text-sm font-medium text-gray-700">パスワード</label>
          <input id="password" name="password" type="password" required autocomplete="new-password"
            class="appearance-none w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500">
        </div>
        <div>
          <label for="confirm_password" class="block text-sm font-medium text-gray-700">パスワード確認</label>
          <input id="confirm_password" name="confirm_password" type="password" required
            class="appearance-none w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500">
        </div>
      </div>

      <div>
        <button type="submit"
          class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
          登録する
        </button>
      </div>
    </form>

    <div class="text-center text-sm text-gray-600">
      すでにアカウントをお持ちですか？
      <a href="{{ url_for('auth.login') }}" class="text-blue-600 hover:text-blue-500 font-medium">ログイン</a>
    </div>
  </div>
</div>
{% endblock %}
