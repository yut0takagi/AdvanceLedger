<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ペイとも - ホーム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body class="bg-blue-50 text-gray-800 font-sans">

  <!-- ヘッダー -->
  <header class="fixed w-full top-0 left-0 right-0 bg-blue-600 text-white shadow-md z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="{{ url_for('home.home') }}" class="text-2xl font-bold tracking-tight hover:text-blue-200 transition">
        ペイとも
      </a>
      <nav class="space-x-4 text-sm">
        {% if session.get('user') %}
        <a href="{{ url_for('dashboard.dashboard', user_id=session['user']['docID']) }}" class="hover:underline">ダッシュボード</a>
        <a href="{{ url_for('group.create_group') }}" class="hover:underline">グループ作成</a>
        <a href="{{ url_for('friend.search_friend_page') }}" class="hover:underline">友達検索</a>
        <a href="{{ url_for('auth.logout') }}" class="hover:underline">ログアウト</a>
        {% else %}
          <a href="{{ url_for('auth.login') }}" class="hover:underline">ログイン</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <!-- スペース確保 -->
  <div class="h-20"></div>

  <!-- メイン + フッター -->
  <main class="flex-grow max-w-5xl mx-auto px-4 py-10 w-full text-center">
    {% block content %}
    {% endblock %}
  </main>

  <!-- フッター -->
  <footer class="bg-white text-center text-gray-400 text-sm py-6 border-t w-full">
    &copy; 2025 ペイとも - 立て替え管理アプリ
  </footer>

</body>
</html>
