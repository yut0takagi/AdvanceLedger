{% extends 'layout/layout1.html' %}

{% block content %}
<div class="max-w-3xl mx-auto text-left">
  <h2 class="text-2xl font-bold text-gray-800 mb-6">通知一覧</h2>

  {% if notifications %}
    <ul class="space-y-4">
      {% for n in notifications %}
        <li class="p-4 rounded-lg shadow-sm {{ 'bg-yellow-100' if not n.is_read else 'bg-white' }}">
          <p class="text-gray-800">{{ n.message }}</p>
          <p class="text-xs text-gray-500 mt-1">{{ n.created_at }}</p>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="text-gray-400">通知はまだありません。</p>
  {% endif %}
</div>
{% endblock %}
